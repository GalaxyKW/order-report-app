plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.orderreport.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.orderreport.app'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.1.4'
    }

    if (signingPropertiesFile.isFile()) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (signingPropertiesFile.isFile()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            maxParallelForks = 1
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            if (project.hasProperty('robolectricSdks')) {
                systemProperty 'robolectric.enabledSdks', project.property('robolectricSdks')
            }
            if (project.hasProperty('testJavaExecutable')) {
                executable project.property('testJavaExecutable')
            }
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!signingPropertiesFile.isFile()) {
            throw new GradleException('缺少 android/keystore.properties，不能构建已签名 Release APK')
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'assembleRelease', 'bundleRelease']) task.dependsOn(verifyReleaseSigning)
}

def repositoryRoot = rootProject.projectDir.parentFile
def syncWebAssets = tasks.register('syncWebAssets', Exec) {
    group = 'build setup'
    description = 'Syncs the current web application into Android assets.'
    workingDir repositoryRoot
    commandLine 'node', 'scripts/sync-android-assets.js'
    inputs.dir new File(repositoryRoot, 'public')
    inputs.dir new File(repositoryRoot, 'shared')
    inputs.file new File(repositoryRoot, 'scripts/sync-android-assets.js')
    inputs.file new File(repositoryRoot, 'scripts/build-web-assets.js')
    inputs.file new File(repositoryRoot, 'package-lock.json')
    outputs.dir new File(projectDir, 'src/main/assets')
}

tasks.named('preBuild').configure {
    dependsOn syncWebAssets
}
