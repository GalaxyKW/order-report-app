<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f5f3ee">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/app-icon-64.png">
    <link rel="apple-touch-icon" href="icons/app-icon-192.png">
    <script>if (new URLSearchParams(location.search).get('nativeInsets') === '1') document.documentElement.classList.add('native-insets');</script>
    <link rel="stylesheet" href="styles.css">
    <title>报单管家</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><img class="brand-mark brand-icon" src="icons/app-icon-64.png" alt="" width="36" height="36"><span class="brand-name">报单管家</span><span id="sync-state" class="status-pill local">仅本地</span></div>
        <div class="top-actions">
          <button class="button button-quiet button-with-icon" type="button" data-action="sync" aria-label="同步"><svg class="ui-icon" data-icon="sync" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg><span class="button-label">同步</span></button>
          <button class="button button-quiet button-with-icon" type="button" data-action="open-settings" aria-label="设置"><svg class="ui-icon" data-icon="settings" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9.5 3-.6 2.2-2 .9-2-.6-2.4 4.2 1.6 1.6v2.4l-1.6 1.6L4.9 19l2-.6 2 .9.6 2.2h5l.6-2.2 2-.9 2 .6 2.4-4.2-1.6-1.6v-2.4l1.6-1.6L19.1 5l-2 .6-2-.9L14.5 3Z"/><circle cx="12" cy="12.2" r="3"/></svg><span class="button-label">设置</span></button>
        </div>
      </header>
      <div class="layout">
        <aside class="sidebar" aria-label="主导航">
          <nav class="nav-list">
            <button class="nav-item active" type="button" data-view="dashboard" aria-current="page" aria-controls="main-content"><span class="nav-icon"><svg class="ui-icon" data-icon="dashboard" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span class="nav-label">总览</span></button>
            <button class="nav-item" type="button" data-view="reports" aria-controls="main-content"><span class="nav-icon"><svg class="ui-icon" data-icon="reports" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></span><span class="nav-label">报单</span></button>
            <button class="nav-item" type="button" data-view="shipments" aria-controls="main-content"><span class="nav-icon"><svg class="ui-icon" data-icon="shipments" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h11v11H8M3 6v11h1M14 10h4l3 4v3h-2M14 17h1"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></span><span class="nav-label">快递</span></button>
            <button class="nav-item" type="button" data-view="inventory" aria-controls="main-content"><span class="nav-icon"><svg class="ui-icon" data-icon="inventory" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 9 9-6 9 6v11a1 1 0 0 1-1 1h-4V11H8v10H4a1 1 0 0 1-1-1Z"/><path d="M8 15h8M8 18h8M8 21h8"/></svg></span><span class="nav-label">仓库</span></button>
            <button class="nav-item" type="button" data-view="refunds" aria-controls="main-content"><span class="nav-icon"><svg class="ui-icon" data-icon="refunds" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3 4 7l4 4M4 7h10a6 6 0 0 1 0 12h-3"/><path d="m11 11 3 3 3-3M14 14v5M11 16h6"/></svg></span><span class="nav-label">退款</span></button>
            <button class="nav-item" type="button" data-view="settings" aria-controls="main-content"><span class="nav-icon"><svg class="ui-icon" data-icon="settings" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9.5 3-.6 2.2-2 .9-2-.6-2.4 4.2 1.6 1.6v2.4l-1.6 1.6L4.9 19l2-.6 2 .9.6 2.2h5l.6-2.2 2-.9 2 .6 2.4-4.2-1.6-1.6v-2.4l1.6-1.6L19.1 5l-2 .6-2-.9L14.5 3Z"/><circle cx="12" cy="12.2" r="3"/></svg></span><span class="nav-label">设置</span></button>
          </nav>
          <div class="sidebar-note">离线可用 · 联网自动同步</div>
        </aside>
        <main id="main-content" class="main-content"><p role="status">正在打开本机数据…</p><noscript>请启用 JavaScript 后重试。本机数据未被清除。</noscript></main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="compat.js"></script>
    <script src="client.js"></script>
  </body>
</html>
